name = hardSubReader
summary = "HardSub Reader"
description = """Reads hardcoded (burned-in) video subtitles, also known as hardsubs, aloud in real time using the high-accuracy Windows 11 OneOCR engine, with automatic fallback to legacy Windows OCR. Press NVDA+alt+shift+s to toggle. Configure in NVDA Settings, HardSub Reader category."""
author = "Shaima Almarzooqi <sshaima004@gmail.com>"
version = 1.3.0
changelog = """
* Added an option to read only subtitles in one language, for videos that mix languages.
* Added a "Restore default settings" button to the settings panel.
* Added an optional detailed diagnostic log, off by default, for use when reporting a problem.
* Fixed subtitles losing a line when both lines of one subtitle looked alike.
* Fixed a line being skipped when it was briefly missed during recognition.
* Fixed the built-in filters removing ordinary dialogue, short words, and any subtitle written in an alphabet other than Latin, Arabic or Cyrillic.
"""
url = https://github.com/Shaima-Almarzooqi/nvda-hardsub-reader
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.1.1
